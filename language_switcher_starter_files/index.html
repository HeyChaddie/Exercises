<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Language Switcher</title>
    <script type="module" src="js.js"></script>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div id="wrapper">
      <header class="header">
        <h1 class="headTitle">Osten</h1>
      </header>
      <main>
        <h3 class="langTitle">Vælg sprog</h3>
        <select id="languages">
          <option value="da">Dansk</option>
          <option value="de">Deutsch</option>
          <option value="is">Icelandic</option>
          <option value="es">Espanol</option>
          <option value="ja">Japanese</option>
          <option value="ko">Korean</option>
        </select>
        <p class="content">
          Ost er et fødemiddel lavet af mælk fra forskellige dyr ved at syrne den med osteløbe eller mælkesyrebakterier.
        </p>
      </main>
      <div class="footer">
        <h2 class="footTitle">Ost er lækkert!</h2>
      </div>
    </div>
  </body>
</html>
